name: postulia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postulia}
      POSTGRES_USER: ${POSTGRES_USER:-postulia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en docker/.env}
    volumes:
      - postulia_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: build
    command:
      ["node_modules/.bin/prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postulia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postulia}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postulia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postulia}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en docker/.env}
      CORS_ORIGINS: ${CORS_ORIGINS:-chrome-extension://*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-600}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1 minute}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postulia_db:
  caddy_data:
  caddy_config:
